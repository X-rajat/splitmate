<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1080" height="640" fill="#F3F6F4"/>

  <!-- ===================== Phone 1: Home ===================== -->
  <g transform="translate(40,40)">
    <rect width="320" height="560" rx="36" fill="#0E1512"/>
    <rect x="10" y="10" width="300" height="540" rx="28" fill="#FBFDFA"/>

    <text x="30" y="55" font-size="20" font-weight="700" fill="#111815">SplitMate</text>

    <!-- Hero balance card -->
    <rect x="24" y="76" width="272" height="132" rx="20" fill="#DCF5E7"/>
    <text x="44" y="108" font-size="12" font-weight="600" fill="#3C5B54">OVERALL BALANCE</text>
    <text x="44" y="150" font-size="34" font-weight="700" fill="#1E8E5A">+2,450.00</text>
    <text x="44" y="172" font-size="12" fill="#3C5B54">You are owed, overall</text>

    <text x="24" y="240" font-size="14" font-weight="600" fill="#26332F">Your groups</text>

    <!-- group row 1 -->
    <rect x="24" y="252" width="272" height="64" rx="16" fill="#E7F0EC"/>
    <circle cx="52" cy="284" r="18" fill="#0F6B5C"/>
    <text x="52" y="290" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">G</text>
    <text x="84" y="280" font-size="13" font-weight="600" fill="#111815">Goa Trip 2026</text>
    <text x="84" y="298" font-size="11" fill="#5B6B66">5 members</text>
    <text x="272" y="288" font-size="13" font-weight="700" fill="#1E8E5A" text-anchor="end">+2,350.00</text>

    <!-- group row 2 -->
    <rect x="24" y="326" width="272" height="64" rx="16" fill="#E7F0EC"/>
    <circle cx="52" cy="358" r="18" fill="#B6720A"/>
    <text x="52" y="364" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text>
    <text x="84" y="354" font-size="13" font-weight="600" fill="#111815">Roommates</text>
    <text x="84" y="372" font-size="11" fill="#5B6B66">3 members</text>
    <text x="272" y="362" font-size="13" font-weight="700" fill="#C5433F" text-anchor="end">-850.00</text>

    <!-- FAB -->
    <rect x="176" y="470" width="120" height="44" rx="22" fill="#0F6B5C"/>
    <text x="236" y="497" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ New group</text>

    <!-- bottom nav -->
    <rect x="10" y="500" width="300" height="50" rx="0" fill="#FBFDFA"/>
    <text x="55" y="530" font-size="10" fill="#0F6B5C" text-anchor="middle">Home</text>
    <text x="130" y="530" font-size="10" fill="#8A968F" text-anchor="middle">Groups</text>
    <text x="205" y="530" font-size="10" fill="#8A968F" text-anchor="middle">Friends</text>
    <text x="270" y="530" font-size="10" fill="#8A968F" text-anchor="middle">Profile</text>
  </g>

  <!-- ===================== Phone 2: Group detail ===================== -->
  <g transform="translate(380,40)">
    <rect width="320" height="560" rx="36" fill="#0E1512"/>
    <rect x="10" y="10" width="300" height="540" rx="28" fill="#FBFDFA"/>

    <text x="30" y="55" font-size="18" font-weight="700" fill="#111815">Group</text>
    <circle cx="270" cy="48" r="14" fill="#E7F0EC"/>
    <circle cx="238" cy="48" r="14" fill="#E7F0EC"/>

    <text x="24" y="90" font-size="13" font-weight="600" fill="#26332F">Suggested settlements</text>
    <rect x="24" y="100" width="272" height="46" rx="14" fill="#FFE0B2"/>
    <text x="40" y="128" font-size="12" font-weight="600" fill="#2A1800">Rahul  &#8594;  RJ         850.00</text>

    <text x="24" y="172" font-size="13" font-weight="600" fill="#26332F">Balances</text>
    <rect x="24" y="182" width="272" height="46" rx="14" fill="#E7F0EC"/>
    <text x="40" y="210" font-size="12" fill="#111815">RJ</text>
    <text x="272" y="210" font-size="12" font-weight="700" fill="#1E8E5A" text-anchor="end">+2,350.00</text>
    <rect x="24" y="234" width="272" height="46" rx="14" fill="#E7F0EC"/>
    <text x="40" y="262" font-size="12" fill="#111815">Neha (guest)</text>
    <text x="272" y="262" font-size="12" font-weight="700" fill="#C5433F" text-anchor="end">-1,500.00</text>

    <text x="24" y="308" font-size="13" font-weight="600" fill="#26332F">Recent expenses</text>
    <rect x="24" y="318" width="272" height="56" rx="14" fill="#E7F0EC"/>
    <circle cx="50" cy="346" r="16" fill="#CDEEE3"/>
    <text x="74" y="342" font-size="12" font-weight="600" fill="#111815">Dinner</text>
    <text x="74" y="358" font-size="10" fill="#5B6B66">Food</text>
    <text x="272" y="350" font-size="12" font-weight="700" fill="#111815" text-anchor="end">4,800.00</text>

    <rect x="24" y="384" width="272" height="56" rx="14" fill="#E7F0EC"/>
    <circle cx="50" cy="412" r="16" fill="#CDEEE3"/>
    <text x="74" y="408" font-size="12" font-weight="600" fill="#111815">Taxi</text>
    <text x="74" y="424" font-size="10" fill="#5B6B66">Transport</text>
    <text x="272" y="416" font-size="12" font-weight="700" fill="#111815" text-anchor="end">1,600.00</text>

    <!-- FAB -->
    <rect x="190" y="470" width="106" height="44" rx="22" fill="#0F6B5C"/>
    <text x="243" y="497" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Expense</text>
  </g>

  <!-- ===================== Phone 3: Add Expense (member picker) ===================== -->
  <g transform="translate(720,40)">
    <rect width="320" height="560" rx="36" fill="#0E1512"/>
    <rect x="10" y="10" width="300" height="540" rx="28" fill="#FBFDFA"/>

    <text x="30" y="55" font-size="18" font-weight="700" fill="#111815">Add expense</text>

    <rect x="24" y="72" width="272" height="150" rx="18" fill="#E7F0EC"/>
    <rect x="40" y="88" width="240" height="34" rx="10" fill="#FFFFFF" stroke="#B7C4BF"/>
    <text x="52" y="110" font-size="11" fill="#5B6B66">Dinner</text>
    <rect x="40" y="132" width="240" height="34" rx="10" fill="#FFFFFF" stroke="#B7C4BF"/>
    <text x="52" y="154" font-size="11" fill="#5B6B66">&#8377; 4,800</text>
    <rect x="40" y="176" width="240" height="34" rx="10" fill="#FFFFFF" stroke="#B7C4BF"/>
    <text x="52" y="198" font-size="11" fill="#5B6B66">Paid by: RJ</text>

    <text x="24" y="248" font-size="12" font-weight="600" fill="#26332F">Split equally between 4 of 5 people</text>

    <!-- member rows -->
    <rect x="24" y="260" width="272" height="38" rx="12" fill="#CDEEE3"/>
    <rect x="36" y="270" width="16" height="16" rx="4" fill="#0F6B5C"/>
    <text x="64" y="283" font-size="12" fill="#111815">RJ</text>

    <rect x="24" y="302" width="272" height="38" rx="12" fill="#CDEEE3"/>
    <rect x="36" y="312" width="16" height="16" rx="4" fill="#0F6B5C"/>
    <text x="64" y="325" font-size="12" fill="#111815">Amit</text>

    <rect x="24" y="344" width="272" height="38" rx="12" fill="#E7F0EC"/>
    <rect x="36" y="354" width="16" height="16" rx="4" fill="none" stroke="#8A968F" stroke-width="2"/>
    <text x="64" y="367" font-size="12" fill="#111815">Rahul</text>

    <rect x="24" y="386" width="272" height="38" rx="12" fill="#CDEEE3"/>
    <rect x="36" y="396" width="16" height="16" rx="4" fill="#0F6B5C"/>
    <text x="64" y="409" font-size="12" fill="#111815">Neha (guest)</text>
    <text x="272" y="409" font-size="10" fill="#B6720A" text-anchor="end">+ Add guest</text>

    <rect x="24" y="470" width="272" height="46" rx="16" fill="#0F6B5C"/>
    <text x="160" y="498" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Save expense</text>
  </g>

  <text x="540" y="625" text-anchor="middle" font-size="13" fill="#5B6B66">Design preview - illustrative mockups built from the app's real color tokens and layout, not live screenshots.</text>
</svg>
